---
- name: Add PHP repository
  ansible.builtin.apt_repository:
    repo: "ppa:ondrej/php"
    state: present
  become: true
  tags: [setup, apache]

- name: Update apt cache after PPA
  ansible.builtin.apt:
    update_cache: true
  become: true
  tags: [setup, apache]

- name: Remove conflicting php packages
  ansible.builtin.apt:
    pkg:
      - php-imagick
    state: absent
  become: true
  tags: [setup, apache]
  ignore_errors: true

- name: Install Apache and PHP
  ansible.builtin.apt:
    pkg:
      - apache2
      - php8.2
      - php8.2-mysql
      - php8.2-cli
      - libapache2-mod-php8.2
    state: present
    autoremove: true
  become: true
  tags: [setup, apache]

- name: Enable Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - ssl
    - proxy
    - proxy_http
  become: true
  notify: restart apache
  tags: [setup, apache]

- name: Enable PHP module
  community.general.apache2_module:
    name: php8.2
    state: present
  become: true
  notify: restart apache
  tags: [setup, apache]

- name: Configure Apache virtual host
  ansible.builtin.template:
    src: wordpress.conf.j2
    dest: /etc/apache2/sites-available/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart apache
  tags: [setup, apache]

- name: Enable WordPress virtual host
  ansible.builtin.command:
    cmd: a2ensite wordpress.conf
  become: true
  notify: restart apache
  tags: [setup, apache]
  changed_when: "'This site is already enabled' not in result.stdout"
  register: result

- name: Disable default Apache site
  ansible.builtin.command:
    cmd: a2dissite 000-default.conf
  become: true
  notify: restart apache
  tags: [setup, apache]
  changed_when: "'not enabled' not in result.stdout"
  register: result
  ignore_errors: true

- name: Test Apache configuration
  ansible.builtin.command:
    cmd: apache2ctl configtest
  become: true
  register: apache_test
  tags: [setup, apache]
  changed_when: false

- name: Display Apache configuration test result
  ansible.builtin.debug:
    msg: "{{ apache_test.stdout }}"
  tags: [setup, apache]
  when: apache_test.rc == 0

- name: Start and enable Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  become: true
  tags: [setup, apache]
