---
- name: Install MySQL dependencies
  ansible.builtin.apt:
    pkg:
      - mysql-server
      - mysql-client
      - python3-pymysql
    state: present
  become: true
  tags: [setup, mysql]

- name: Start MySQL service
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  become: true
  tags: mysql

- name: Create WordPress database
  community.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true
  tags: mysql

- name: Create WordPress database user with proper privileges
  community.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,INDEX,ALTER"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
    host: "{{ item }}"
  loop:
    - 'localhost'
    - '127.0.0.1'
    - '%'
  become: true
  tags: mysql
  no_log: true

- name: Configure MySQL to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: "bind-address = 0.0.0.0"
    backup: true
  become: true
  notify: restart mysql
  tags: mysql

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name: ''
    host: "{{ item }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  loop:
    - localhost
    - "{{ ansible_fqdn }}"
  become: true
  tags: mysql
  ignore_errors: true

- name: Remove MySQL test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true
  tags: mysql
  ignore_errors: true

- name: Flush MySQL privileges
  ansible.builtin.command:
    cmd: mysql -e "FLUSH PRIVILEGES;"
  become: true
  tags: mysql
  changed_when: false
